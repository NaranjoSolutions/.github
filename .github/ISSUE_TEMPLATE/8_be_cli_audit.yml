name: CLI Code Audit
description: Request a deep CLI engineering review using the shared audit prompt.
title: "[CLI Code Audit]: "
labels: ["code-audit", "cli"]

assignees:
  - Alonsovn

body:
  - type: markdown
    attributes:
      value: |
        Use the CLI audit prompt in [.github/ISSUE_TEMPLATE/be_cli_audit.md](https://github.com/NaranjoSolutions/.github/blob/main/.github/ISSUE_TEMPLATE/be_cli_audit.md).

        The reviewer should follow that prompt for scope, scoring, required reports.

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables Check
      description: Confirm any report names, output paths, or extra expectations beyond the shared prompt.
      value: |
        Generate:
        - /docs/code-audits/YYYY-MM-DD/project-evaluation.md
        - /docs/code-audits/YYYY-MM-DD/cli-architecture-review.md
        - /docs/code-audits/YYYY-MM-DD/cli-ux-review.md
        - /docs/code-audits/YYYY-MM-DD/security-review.md
        - /docs/code-audits/YYYY-MM-DD/performance-review.md
        - /docs/code-audits/YYYY-MM-DD/packaging-review.md
        - /docs/code-audits/YYYY-MM-DD/improvement-roadmap.md
    validations:
      required: true
