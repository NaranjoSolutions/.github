name: Frontend Code Audit
description: Request a deep frontend engineering review using the shared audit prompt.
title: "[FE Code Audit]: "
labels: ["code-audit", "frontend"]

assignees:
  - Alonsovn

body:
  - type: markdown
    attributes:
      value: |
        Use the frontend audit prompt in [.github/ISSUE_TEMPLATE/fe_react_audit.md](https://github.com/NaranjoSolutions/.github/blob/main/.github/ISSUE_TEMPLATE/fe_react_audit.md).

        The reviewer should follow that prompt for scope, scoring, required reports.

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables Check
      description: Confirm any report names, output paths, or extra expectations beyond the shared prompt.
      value: |
        Generate:
        - /docs/code-audits/YY-MM-DD/frontend-review.md
        - /docs/code-audits/YY-MM-DD/architecture-review.md
        - /docs/code-audits/YY-MM-DD/performance-review.md
        - /docs/code-audits/YY-MM-DD/accessibility-review.md
        - /docs/code-audits/YY-MM-DD/security-review.md
        - /docs/code-audits/YY-MM-DD/testing-review.md
        - /docs/code-audits/YY-MM-DD/improvement-roadmap.md
    validations:
      required: true
