name: Backend Code Audit
description: Request a deep backend engineering review using the shared audit prompt.
title: "[BE Code Audit]: "
labels: ["code-audit", "backend"]

assignees:
  - Alonsovn

body:
  - type: markdown
    attributes:
      value: |
        Use the backend audit prompt in [.github/ISSUE_TEMPLATE/be_api_audit.md](https://github.com/NaranjoSolutions/.github/blob/main/.github/ISSUE_TEMPLATE/be_api_audit.md).

        The reviewer should follow that prompt for scope, scoring, required reports.

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables Check
      description: Confirm any report names, output paths, or extra expectations beyond the shared prompt.
      value: |
        Generate:
        - /docs/code-audits/YY-MM-DD/backend-review.md
        - /docs/code-audits/YY-MM-DD/api-review.md
        - /docs/code-audits/YY-MM-DD/architecture-review.md
        - /docs/code-audits/YY-MM-DD/security-review.md
        - /docs/code-audits/YY-MM-DD/scalability-review.md
        - /docs/code-audits/YY-MM-DD/observability-review.md
        - /docs/code-audits/YY-MM-DD/testing-review.md
        - /docs/code-audits/YY-MM-DD/improvement-roadmap.md
    validations:
      required: true
