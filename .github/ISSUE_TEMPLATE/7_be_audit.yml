name: Backend Evaluation
description: Request a deep backend engineering review using the shared audit prompt.
title: "[BE Evaluation]: "
labels: ["evaluation", "backend"]

assignees:
  - Alonsovn

body:
  - type: markdown
    attributes:
      value: |
        Use the backend audit prompt in [.github/ISSUE_TEMPLATE/be_api_audit.md](https://github.com/NaranjoSolutions/.github/blob/main/.github/ISSUE_TEMPLATE/be_api_audit.md).

        The reviewer should follow that prompt for scope, scoring, required reports, and work-log output.

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables Check
      description: Confirm any report names, output paths, or extra expectations beyond the shared prompt.
      value: |
        Generate:
        - /docs/evaluation/YY-MM-DD/backend-review.md
        - /docs/evaluation/YY-MM-DD/api-review.md
        - /docs/evaluation/YY-MM-DD/architecture-review.md
        - /docs/evaluation/YY-MM-DD/security-review.md
        - /docs/evaluation/YY-MM-DD/scalability-review.md
        - /docs/evaluation/YY-MM-DD/observability-review.md
        - /docs/evaluation/YY-MM-DD/testing-review.md
        - /docs/evaluation/YY-MM-DD/improvement-roadmap.md
        - /docs/work-logs/implementation-YY-MM-DD.md
    validations:
      required: true

